<!-- Custom Tailored Cartoon Caricature of Mehadi Hasan Shameem matching his actual photo -->
<div class="avatar-character" data-drift="-4 -6">
  <svg id="avatar-svg" viewBox="0 0 200 200" style="width: 100%; height: 100%; overflow: visible;" xmlns="http://www.w3.org/2000/svg">
    <!-- Drop shadow base -->
    <ellipse cx="100" cy="188" rx="58" ry="8" fill="var(--line)" opacity="0.2" />

    <!-- Gray Button-Down Collared Shirt matching Shameem's Ralph Lauren shirt in Photo -->
    <path d="M46 195 C46 156, 154 156, 154 195" fill="#475569" stroke="var(--line)" stroke-width="3.5" stroke-linejoin="round" />
    <!-- Fine pinstripes on shirt -->
    <g stroke="rgba(255,255,255,0.18)" stroke-width="1.5">
      <line x1="60" y1="165" x2="60" y2="195" />
      <line x1="72" y1="160" x2="72" y2="195" />
      <line x1="128" y1="160" x2="128" y2="195" />
      <line x1="140" y1="165" x2="140" y2="195" />
    </g>
    <!-- Open collar placket & button-down collar points -->
    <polygon points="100,166 82,142 100,174 118,142" fill="#64748b" stroke="var(--line)" stroke-width="2.5" />
    <circle cx="86" cy="154" r="1.5" fill="#ffffff" />
    <circle cx="114" cy="154" r="1.5" fill="#ffffff" />
    <circle cx="100" cy="184" r="2" fill="#ffffff" stroke="var(--line)" stroke-width="1" />

    <!-- Tilting Head Group (Tracks Mouse Coordinates) -->
    <g id="avatar-head-group">
      <!-- Neck with shadow contour -->
      <rect x="88" y="125" width="24" height="26" fill="#bf8557" stroke="var(--line)" stroke-width="3" rx="2" />
      <path d="M88 132 C95 137, 105 137, 112 132" fill="#a87146" />

      <!-- Ears with realistic inner cartilage -->
      <circle cx="55" cy="100" r="10" fill="#bf8557" stroke="var(--line)" stroke-width="3" />
      <circle cx="145" cy="100" r="10" fill="#bf8557" stroke="var(--line)" stroke-width="3" />
      <path d="M56 96 Q53 100 56 104" fill="none" stroke="#8c542f" stroke-width="2" stroke-linecap="round" />
      <path d="M144 96 Q147 100 144 104" fill="none" stroke="#8c542f" stroke-width="2" stroke-linecap="round" />

      <!-- Head Base (Warm Golden Bronze Tone matching Photo) -->
      <path d="M62 66 C62 46, 138 46, 138 66 L138 98 C138 120, 122 136, 100 136 C78 136, 62 120, 62 98 Z" fill="#bf8557" stroke="var(--line)" stroke-width="3.5" />

      <!-- Eyebrows (Thick, natural arches matching Shameem's exact brows in Photo) -->
      <path d="M70 81 Q82 75 94 81" stroke="#14121d" stroke-width="4.5" stroke-linecap="round" fill="none" />
      <path d="M106 81 Q118 75 130 81" stroke="#14121d" stroke-width="4.5" stroke-linecap="round" fill="none" />

      <!-- Left Eye: Distinct almond shape with eyelid crease -->
      <path d="M72 87 Q82 84 92 87" fill="none" stroke="#8c542f" stroke-width="1.8" />
      <g transform="translate(82, 94)">
        <ellipse cx="0" cy="0" rx="9.5" ry="7.2" fill="#ffffff" stroke="var(--line)" stroke-width="2.5" />
        <circle id="avatar-pupil-left" cx="0" cy="0" r="4.3" fill="#14121d" />
        <circle cx="1.5" cy="-1.5" r="1.2" fill="#ffffff" opacity="0.8" />
        <path class="avatar-eyelid" d="M-9.5 -1 Q0 8 9.5 -1" stroke="var(--line)" stroke-width="2.8" fill="none" style="opacity: 0;" />
      </g>

      <!-- Right Eye: Distinct almond shape with eyelid crease -->
      <path d="M108 87 Q118 84 128 87" fill="none" stroke="#8c542f" stroke-width="1.8" />
      <g transform="translate(118, 94)">
        <ellipse cx="0" cy="0" rx="9.5" ry="7.2" fill="#ffffff" stroke="var(--line)" stroke-width="2.5" />
        <circle id="avatar-pupil-right" cx="0" cy="0" r="4.3" fill="#14121d" />
        <circle cx="1.5" cy="-1.5" r="1.2" fill="#ffffff" opacity="0.8" />
        <path class="avatar-eyelid" d="M-9.5 -1 Q0 8 9.5 -1" stroke="var(--line)" stroke-width="2.8" fill="none" style="opacity: 0;" />
      </g>

      <!-- Nose (Defined straight bridge, rounded tip, soft nostrils) -->
      <path d="M100 84 L97 105 Q100 108 103 105" fill="none" stroke="var(--line)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M93 104 Q96 106 97 104" fill="none" stroke="#8c542f" stroke-width="1.8" />
      <path d="M107 104 Q104 106 103 104" fill="none" stroke="#8c542f" stroke-width="1.8" />

      <!-- Full Neat Groomed Beard & Mustache matching Photo -->
      <!-- Mustache covering upper lip and curving down into beard -->
      <path d="M86 113 Q100 109 114 113 C116 117, 114 122, 110 121 C105 120, 100 118, 95 120 C91 122, 85 117, 86 113 Z" fill="#14121d" stroke="var(--line)" stroke-width="1.5" />
      
      <!-- Calm, thoughtful slight smile -->
      <path d="M92 119 Q100 124 108 119" fill="none" stroke="#7a3e20" stroke-width="2.6" stroke-linecap="round" />
      
      <!-- Full beard along jaw, cheeks, chin, and neck line -->
      <path d="M63 92 L63 106 C63 125, 78 138, 100 138 C122 138, 137 125, 137 106 L137 92 C134 112, 120 128, 100 128 C80 128, 66 112, 63 92 Z" fill="#14121d" stroke="var(--line)" stroke-width="2" />
      <!-- Soul patch under lower lip -->
      <polygon points="98,122 102,122 100,126" fill="#14121d" />

      <!-- Shameem's Natural Textured Wavy Hair (Side-swept volume from Photo) -->
      <!-- Hair Base -->
      <path d="M56 74 C54 48, 66 28, 96 26 C124 24, 144 36, 144 64 C144 76, 138 78, 136 68 C132 48, 118 42, 98 42 C82 42, 68 50, 64 74 Z" fill="#14121d" stroke="var(--line)" stroke-width="3" stroke-linejoin="round" />
      <!-- Forehead wave fringes falling naturally over brow from Photo -->
      <path d="M72 48 Q88 38 108 42 Q96 52 82 50 Z" fill="#241f33" />
      <path d="M94 28 Q115 22 134 33 Q118 40 98 40 Z" fill="#241f33" />
      <path d="M68 58 Q82 54 94 62 Q78 64 68 58 Z" fill="#14121d" />
      <!-- Right temple sweep -->
      <path d="M124 44 Q138 52 142 66 Q134 62 128 54 Z" fill="#241f33" />
    </g>
  </svg>
</div>
